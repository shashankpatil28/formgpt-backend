<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormGPT - POC</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Fira+Code&display=swap" rel="stylesheet">
</head>
<body>

    <main class="container">
        <h1>🤖 FormGPT</h1>
        <p class="subtitle">Enter a natural language prompt to generate a JSON form schema.</p>

        <div class="form-container">
            <textarea id="prompt-textarea" rows="4" placeholder="e.g., A simple contact form with name, email, and a message box..."></textarea>
            <button id="generate-btn">
                <span class="btn-text">Generate</span>
                <span class="loader hidden"></span>
            </button>
        </div>

        <div id="error-box" class="error-box hidden"></div>

        <div class="response-container">
            <h2>Generated Schema</h2>
            <pre id="json-output"><code>Waiting for input...</code></pre>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
